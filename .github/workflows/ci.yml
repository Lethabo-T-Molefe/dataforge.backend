name: CI

on:
  push:
    branches: [main, "final-year/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dataforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # The tests create and rebuild dataforge_test next to this database.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/dataforge

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      # Failures are also written as annotations, which show inline on pull requests.
      - name: Ruff
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check .

      - name: Mypy
        run: |
          set +e
          uv run mypy src > mypy.txt 2>&1
          status=$?
          cat mypy.txt
          uv run python scripts/ci_annotate.py mypy mypy.txt
          exit $status

      - name: Tests
        env:
          # Tests that produce a report (the assistant evaluation) write it here; it is shown as a notice.
          CI_NOTICES: ci-notices.txt
        run: |
          set +e
          uv run pytest -q --junitxml=report.xml
          status=$?
          uv run python scripts/ci_annotate.py notices ci-notices.txt
          uv run python scripts/ci_annotate.py junit report.xml
          exit $status

  image:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: API image
        run: docker build -t dataforge-api .
