name: CI/CD

on:
  push:
    branches: [main, "final-year/**"]
  pull_request:

# A newer push cancels an older run on other branches; on main, runs queue so a deploy is never cut off.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dataforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # The tests create and rebuild dataforge_test next to this database.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/dataforge

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      # Failures are also written as annotations, which show inline on pull requests.
      - name: Ruff
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check .

      - name: Mypy
        run: |
          set +e
          uv run mypy src > mypy.txt 2>&1
          status=$?
          cat mypy.txt
          uv run python scripts/ci_annotate.py mypy mypy.txt
          exit $status

      - name: Tests
        env:
          # Tests that produce a report (the assistant evaluation) write it here; it is shown as a notice.
          CI_NOTICES: ci-notices.txt
        run: |
          set +e
          uv run pytest -q --junitxml=report.xml
          status=$?
          uv run python scripts/ci_annotate.py notices ci-notices.txt
          uv run python scripts/ci_annotate.py junit report.xml
          exit $status

  image:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: API image
        run: docker build -t dataforge-api .

  # CD: after every check passes on a push to main, the EC2 host deploys that commit.
  # GitHub signs in to AWS with OIDC (no stored keys) as a role that may only send commands to this instance,
  # and Systems Manager runs ops/ec2/deploy.sh there, which rolls back if the new version is unhealthy.
  deploy:
    name: Deploy to EC2
    needs: [checks, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-ec2
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: af-south-1
      AWS_ROLE_ARN: arn:aws:iam::134506021502:role/dataforge-github-deploy
      EC2_INSTANCE_ID: i-046e0963d5e4e42b8
      API_URL: https://13-244-116-179.sslip.io
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy over Systems Manager
        run: |
          set -euo pipefail
          id=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy ${GITHUB_SHA::7}" \
            --timeout-seconds 900 \
            --parameters "commands=[\"/opt/dataforge/deploy.sh $GITHUB_SHA\"]" \
            --query Command.CommandId --output text)
          echo "SSM command $id"
          status=Pending
          for _ in $(seq 1 180); do
            sleep 5
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$EC2_INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$EC2_INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text || true
          echo "Status: $status"
          [ "$status" = Success ]

      - name: Public health check
        run: |
          for _ in $(seq 1 12); do
            if body=$(curl -fsS -m 10 "$API_URL/api/v1/health"); then
              echo "$body"
              echo "Live at $API_URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::$API_URL/api/v1/health did not answer"
          exit 1
