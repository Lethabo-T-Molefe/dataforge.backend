[project]
name = "dataforge-backend"
version = "0.1.0"
description = "DataForge backend API (FastAPI): governed analytics for everyday users and data scientists"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=0.75.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "cloudinary>=1.46.2",
    "cryptography>=46.0.0",
    "fastapi[standard]>=0.141.1",
    "fpdf2>=2.8.0",
    "numpy>=2.3.0",
    "openpyxl>=3.1.5",
    "pandas>=2.3.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.10.0",
    "pyotp>=2.9.0",
    "python-dotenv>=1.2.3",
    "redis>=8.1.0",
    "scikit-learn>=1.7.0",
    "sentry-sdk[fastapi]>=2.71.0",
    "slowapi>=0.1.10",
    "sqlalchemy[asyncio]>=2.1.1",
    "sqlglot>=27.0.0",
    "structlog>=26.1.0",
    "typer>=0.27.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
dataforge = "dataforge_backend.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dataforge_backend"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pandas-stubs>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# `ruff format` owns line length for code. Long user-facing messages and SQL text are kept on one line
# so they stay searchable, which is the only thing E501 would still flag.
ignore = ["E501"]

[tool.ruff.lint.isort]
# The local alembic/ migrations folder would otherwise make ruff treat the package as first-party.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# FastAPI dependencies are declared as default arguments by design.
"src/dataforge_backend/presentation/**" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# These libraries ship without type information.
module = ["sklearn.*", "fpdf.*", "pyotp.*", "openpyxl.*", "slowapi.*", "scipy.*", "asyncpg.*", "cloudinary.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["src"]
testpaths = ["tests"]
